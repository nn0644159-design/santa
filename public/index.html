<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Тайный Санта</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;800&family=Pacifico&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--tx:#f3efff;--pk:#ff7a90}
*{box-sizing:border-box;margin:0}html{background:#080a26}body:before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,#080a26 0%,#1d1650 50%,#4a2272 100%)}
body{font:15px/1.5 Nunito,system-ui,sans-serif;color:var(--tx);min-height:100vh;padding:34px 16px 110px;overflow-x:hidden}
canvas,#scene,.au,.moon{position:fixed;pointer-events:none}
canvas{inset:0}
#scene{left:0;right:0;bottom:0;width:100%;height:30vh;min-height:170px;transform:translateZ(0);will-change:transform}
.au{left:-20%;right:-20%;top:2%;height:46vh;opacity:.55;background:radial-gradient(50% 50% at 30% 50%,#3ddc9788,transparent 70%),radial-gradient(45% 50% at 70% 45%,#5ab8ff77,transparent 70%);will-change:transform;animation:au 14s ease-in-out infinite alternate}
.au.b{top:14%;opacity:.4;animation-delay:-7s;background:radial-gradient(50% 50% at 35% 50%,#b36bff77,transparent 70%),radial-gradient(45% 50% at 72% 50%,#ff7ab655,transparent 70%)}
@keyframes au{to{transform:translateX(10%) scaleY(1.25)}}
.moon{top:62px;left:22px;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#e9e3ff 60%,#bdb2f0);box-shadow:0 0 40px 12px #cfc3ff55;will-change:transform;animation:mp 6s ease-in-out infinite}
@keyframes mp{50%{transform:scale(1.08)}}
.pn{animation:sway 5s ease-in-out infinite}@keyframes sway{50%{transform:rotate(2deg)}}
.wn{fill:#ffd36e;animation:fk2 3s ease-in-out infinite}@keyframes fk2{50%{opacity:.55}}
main{position:relative;max-width:480px;margin:auto}
h1,h2{line-height:1.15}h1{font:400 40px Pacifico,cursive;text-align:center}h2{font:800 20px Nunito}
.gold{color:#fff;text-shadow:0 0 18px #8fd0ff88}
.glass{background:rgba(255,255,255,.1);backdrop-filter:blur(16px);border:1px solid #ffffff30;box-shadow:0 20px 50px #0006,inset 0 1px 0 #ffffff30;border-radius:28px;padding:22px;margin:16px 0;animation:in .7s cubic-bezier(.2,1.2,.4,1) both}
#app>:nth-child(2){animation-delay:.1s}#app>:nth-child(3){animation-delay:.2s}#app>:nth-child(4){animation-delay:.3s}#app>:nth-child(5){animation-delay:.4s}
@keyframes in{from{opacity:0;transform:translateY(24px) scale(.95)}}
input,textarea{width:100%;background:rgba(255,255,255,.08);border:1px solid #ffffff33;border-radius:18px;padding:14px 16px;color:#fff;font:inherit;margin:7px 0;outline:0;resize:none;transition:.25s}
input::placeholder,textarea::placeholder{color:#ffffff77}
input:focus,textarea:focus{border-color:#8fd0ff;box-shadow:0 0 0 4px #8fd0ff26,0 0 24px #8fd0ff33;background:rgba(255,255,255,.14)}
button{position:relative;width:100%;border:0;border-radius:999px;padding:16px;font:800 16px Nunito;color:#fff;background:linear-gradient(180deg,#ff7a90,#e0305a);cursor:pointer;margin:10px 0 2px;box-shadow:0 10px 28px #ff4d7a55,inset 0 1px 0 #fff6;transition:transform .2s}
button:active{transform:scale(.96)}button.ghost{background:rgba(255,255,255,.08);border:1px solid #ffffff40;box-shadow:none}
.cta{margin-top:20px;max-width:340px}.cta:before{content:"";position:absolute;inset:0;border-radius:999px;border:2px solid #ff7a90cc;animation:ring 2.2s infinite}@keyframes ring{to{transform:scale(1.18,1.7);opacity:0}}
.intro{min-height:calc(100vh - 140px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.intro h1 span{display:inline-block;animation:lt .7s cubic-bezier(.2,1.5,.4,1) both}@keyframes lt{from{opacity:0;transform:translateY(26px) scale(.5)}}
.intro h1{color:#fff;text-shadow:0 0 26px #8fd0ffaa,0 4px 0 #6a2f8a}.intro p{margin-top:12px;max-width:320px;animation:in 1s .9s both}.intro .cta{animation:in 1s 1.2s both}
.globe{position:relative;width:min(74vw,290px);margin-bottom:14px;cursor:pointer;animation:flt 5s ease-in-out infinite}@keyframes flt{50%{transform:translateY(-10px)}}
.globe:before{content:"";position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(#8fd0ff44,transparent 65%)}.globe svg{width:100%;display:block;position:relative}.globe.sk svg{animation:shk .8s}
@keyframes shk{20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(2deg)}}
.fk{fill:#fff;animation:fa 5s linear infinite}.sk .fk{animation-duration:1.3s}@keyframes fa{to{transform:translateY(150px)}}
.globe span{position:absolute;font-size:30px;animation:orb 4s ease-in-out infinite}@keyframes orb{50%{transform:translateY(-12px) rotate(12deg)}}
.o1{left:-6%;top:8%}.o2{right:-4%;top:2%;animation-delay:-1s!important}.o3{left:-2%;bottom:26%;animation-delay:-2s!important}.o4{right:-6%;bottom:32%;animation-delay:-3s!important}
.dots{display:flex;gap:6px;justify-content:center}.dots i{height:6px;width:22px;border-radius:6px;background:#ffffff26;transition:.5s}.dots i.ok{background:#ffffff77}.dots i.on{width:46px;background:var(--pk);box-shadow:0 0 14px var(--pk)}
.wc{--a:#5cc4d6;--b:#2c8fb3;position:relative;border-radius:28px;padding:24px;color:#fff;background:linear-gradient(150deg,var(--a),var(--b));box-shadow:0 24px 50px #0007,0 0 36px color-mix(in srgb,var(--a) 45%,transparent),inset 0 1px 0 #fff6;overflow:hidden;margin:16px 0 0;animation:pop .9s cubic-bezier(.2,1.4,.4,1) both,fl 7s 1s ease-in-out infinite}
@keyframes pop{from{opacity:0;transform:perspective(700px) rotateX(60deg) scale(.85)}}
.wc[data-t=r]{--a:#f0728a;--b:#c23a5c}.wc[data-t=s]{--a:#6ea4ff;--b:#3a63d6}.wc[data-t=g]{--a:#b9c8e0;--b:#7d93b8}
.wc:before{content:"❄";position:absolute;right:-14px;top:-30px;font-size:150px;opacity:.16;animation:spin 30s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.wc:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 42%,#fff5 50%,transparent 58%);transform:translateX(-120%);animation:sw 6s infinite}
@keyframes sw{55%,100%{transform:translateX(120%)}}@keyframes fl{50%{transform:translateY(-5px)}}
.wc .em{font-size:40px;display:inline-block;animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px) rotate(8deg)}}
.wc h2{font-size:24px;margin-top:6px}.wc p{margin-top:10px}.wc small{opacity:.85}.av{opacity:.8}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.row>*{flex:1;min-width:46px}
.chip{padding:10px;border-radius:16px;text-align:center;border:1px solid #ffffff33;cursor:pointer;font-size:22px;background:rgba(255,255,255,.07);transition:.25s}.chip.on{background:#ffffff2e;border-color:#8fd0ff;box-shadow:0 0 20px #8fd0ff55;animation:pp .45s}@keyframes pp{50%{transform:scale(1.2)}}
.tier{cursor:pointer;--c:#8fd0ff}.tier.t2{--c:#4ce0d0}.tier.t3{--c:#b88cff}
.tier{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 24%,transparent),rgba(255,255,255,.05));border-color:color-mix(in srgb,var(--c) 45%,transparent)}.tier h2{margin-bottom:6px;color:var(--c)}
.tier.on{border-color:var(--c);box-shadow:0 0 44px color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 0 1px #ffffff40;animation:in .7s both,gp 3s ease-in-out infinite}@keyframes gp{50%{transform:scale(1.015)}}
.msgs{height:50vh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px}.b{max-width:80%;padding:10px 15px;border-radius:20px 20px 20px 6px;background:rgba(255,255,255,.14);animation:in .35s cubic-bezier(.2,1.4,.4,1) both}.b.me{align-self:flex-end;border-radius:20px 20px 6px 20px;background:linear-gradient(180deg,#ff7a90,#e0305a)}
p.mut{color:#f3efffb3}
.glass{-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);position:relative;overflow:hidden;background:radial-gradient(200px circle at var(--mx,30%) var(--my,0),#ffffff3a,transparent 60%),linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.05) 45%,rgba(255,255,255,.12));border-color:transparent;box-shadow:0 24px 60px #0007,inset 0 0 0 1px #ffffff40,inset 2px 3px 10px #ffffff40,inset -3px -4px 14px #8fd0ff33}
.glass:before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,#fffa,transparent 30%,transparent 70%,#8fd0ffaa);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.glass:after{content:"";position:absolute;top:0;bottom:0;left:0;width:60%;pointer-events:none;background:linear-gradient(115deg,transparent 30%,#ffffff22 50%,transparent 70%);transform:translateX(-120%);will-change:transform;animation:gsw 9s infinite}
@keyframes gsw{55%,100%{transform:translateX(260%)}}
button{transition:transform .4s cubic-bezier(.2,1.7,.4,1),box-shadow .3s}button:active{transform:scale(.94,1.07)}
button:after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,#ffffff55,transparent 52%);pointer-events:none}
.chip{box-shadow:inset 1px 2px 6px #ffffff40,inset -2px -3px 8px #8fd0ff22}
#sp{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(80% 60% at 50% 40%,#2a1b6a,#080a26 70%);animation:fi .5s both}@keyframes fi{from{opacity:0}}
#sp.go{animation:out .7s both}@keyframes out{to{opacity:0;transform:scale(1.5);filter:blur(14px)}}
#sp svg{width:min(78vw,320px);overflow:visible;animation:zin 4.5s ease-in-out both}
@keyframes zin{0%{transform:scale(.4) rotate(-8deg);opacity:0}14%{transform:scale(1) rotate(0);opacity:1}70%{transform:rotate(0)}76%{transform:rotate(-8deg)}82%{transform:rotate(7deg)}89%{transform:rotate(-3deg)}100%{transform:scale(1.06) rotate(0)}}
.sb{transform-box:fill-box;transform-origin:center bottom;opacity:0;animation:dr .75s cubic-bezier(.3,1.3,.5,1) var(--d) both}
@keyframes dr{from{opacity:0;transform:translateY(-150px) scale(.85,1.2)}55%{opacity:1;transform:translateY(0) scale(1.18,.82)}to{opacity:1;transform:none}}
.fd{opacity:0;animation:fi .4s var(--d) both}.pp{transform-box:fill-box;transform-origin:left center;animation:pp2 .45s cubic-bezier(.3,1.8,.5,1) var(--d) both}@keyframes pp2{from{transform:scale(0)}}
.dw{stroke-dasharray:1;stroke-dashoffset:1;animation:dwa .6s var(--d) forwards}@keyframes dwa{to{stroke-dashoffset:0}}
.hl{animation:hlm 4s ease-in-out infinite}@keyframes hlm{50%{transform:translate(8px,5px)}}
.sptx{margin-top:18px;font:400 38px Pacifico,cursive;color:#fff;text-shadow:0 0 26px #8fd0ffaa,0 4px 0 #6a2f8a}.sptx span{display:inline-block;animation:lt .7s cubic-bezier(.2,1.5,.4,1) both}
#sp small{position:absolute;bottom:26px;opacity:0;font-size:12px;color:#fff;animation:fi 1s 1.5s forwards}
.ref{display:flex;align-items:baseline;gap:10px;margin:14px 0 8px}.ref b{font:400 54px Pacifico,cursive;color:#fff;text-shadow:0 0 24px #ff7a90aa}.bar{height:10px;border-radius:10px;background:#ffffff22;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff7a90,#ffd36e);border-radius:10px;transition:width 1s}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div class=au></div><div class="au b"></div><div class=moon></div><svg id=scene viewBox="0 0 400 200" preserveAspectRatio="xMidYMax slice"><path d="M0 120 Q80 70 170 110 T400 90 V200H0Z" fill="#2c2a73" /><path d="M0 150 Q100 110 200 145 T400 135 V200H0Z" fill="#1c1d58" /><rect x=190 y=132 width=46 height=32 fill="#3a2a5c" /><polygon points="185,132 213,108 241,132" fill="#e8f0ff" /><rect class=wn x=198 y=142 width=11 height=11 /><rect class=wn x=218 y=142 width=11 height=11 style="animation-delay:-1.3s" /><path d="M0 170 Q120 150 230 168 T400 160 V200H0Z" fill="#f1f6ff" opacity=.95 /></svg><canvas id=c></canvas><main id=app></main>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();try{tg.setHeaderColor('#080a26');tg.setBackgroundColor('#080a26')}catch{}
const $=s=>document.querySelector(s),e=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=(a,d={})=>fetch('/api',{method:'POST',headers:{'content-type':'application/json','x-init':tg.initData},body:JSON.stringify({a,...d})}).then(r=>r.json());
const hap=()=>{try{tg.HapticFeedback.impactOccurred('light')}catch{}};
let S,st=1,F={w:{theme:'e',emoji:'🎄'}},iv,role;
const TH=['e','r','s','g'],EM=['🎄','🦌','⭐','❄️','🔔','🍪'];
const DESC={1:'Уютное сообщество: тёплые, душевные подарки и приятные мелочи. Бесплатно.',2:'VIP-круг: желания участников заметно дороже и продуманнее. Для тех, кто любит дарить с размахом.',3:'Премиум-круг: самые щедрые желания и самые впечатляющие подарки. Закрытое сообщество.'};
const ICO={1:'❄️',2:'✨',3:'💎'};
const dots=n=>`<div class=dots>${[2,3,4].map(i=>`<i class="${i==n?'on':i<n?'ok':''}"></i>`).join('')}</div>`;
function card(u){const w=u.wish||u.w||{};return `<div class=wc data-t=${w.theme||'e'}><div class=em>${w.emoji||'🎄'}</div><h2>${e(u.name)||'Имя'} ${e(u.surname)}</h2><small>${e(u.group)||'Группа'}</small><p>🎁 ${e(w.dream)||'Твоё главное желание'}</p>${w.small?`<p>✨ ${e(w.small)}</p>`:''}${w.avoid?`<p class=av>🚫 ${e(w.avoid)}</p>`:''}</div>`}
async function load(){try{S=await api('me')}catch{return $('#app').innerHTML='<div class=glass>Нет связи. Закрой и снова открой приложение.</div>'}if(S.closed)return $('#app').innerHTML='<div class=glass><h2 class=gold>Регистрация закрыта</h2><p class=mut>Жеребьёвка уже прошла. Следи за новостями ❄️</p></div>';
 if(S.err)return $('#app').innerHTML='<div class=glass>Открой приложение через Telegram-бота.</div>';
 if(S.u.wish?.dream){F={name:S.u.name,surname:S.u.surname,group:S.u.group,w:S.u.wish};if(st<4)st=10}view()}
function view(){const A=$('#app');
 if(st==1)A.innerHTML=`<div class=intro><div class=globe onclick="this.classList.remove('sk');void this.offsetWidth;this.classList.add('sk')"><svg viewBox="0 0 200 220"><defs><radialGradient id=gl cx=.35 cy=.3 r=.9><stop offset=0 stop-color="#fff" stop-opacity=.35 /><stop offset=1 stop-color="#8fd0ff" stop-opacity=.08 /></radialGradient><linearGradient id=sk x1=0 y1=0 x2=0 y2=1><stop offset=0 stop-color="#1b1858" /><stop offset=1 stop-color="#8e3d8f" /></linearGradient><linearGradient id=bs x1=0 y1=0 x2=0 y2=1><stop offset=0 stop-color="#e0305a" /><stop offset=1 stop-color="#7a1030" /></linearGradient><clipPath id=cp><circle cx=100 cy=96 r=80 /></clipPath></defs><rect x=40 y=160 width=120 height=46 rx=12 fill="url(#bs)" /><rect x=48 y=164 width=104 height=4 rx=2 fill="#ffffff55" /><g clip-path="url(#cp)"><rect width=200 height=180 fill="url(#sk)" /><circle cx=150 cy=48 r=9 fill="#fff7d6" /><ellipse cx=100 cy=170 rx=110 ry=44 fill="#f4f8ff" /><rect x=78 y=118 width=44 height=36 fill="#4a2a66" /><polygon points="72,118 100,94 128,118" fill="#fff" /><rect class=wn x=86 y=128 width=10 height=10 /><rect class=wn x=106 y=128 width=10 height=10 style="animation-delay:-1.4s" /><polygon points="40,152 54,112 68,152" fill="#1d5a4a" /><polygon points="132,152 144,120 156,152" fill="#1d5a4a" />${[...Array(14)].map((_,i)=>`<circle class=fk cx=${28+i*10+(i%3)*4} cy=14 r=${1+i%3*.7} style="animation-delay:-${(i*.7).toFixed(1)}s" />`).join('')}</g><circle cx=100 cy=96 r=80 fill="url(#gl)" stroke="#fff" stroke-opacity=.45 stroke-width=2 /><ellipse cx=68 cy=52 rx=18 ry=9 fill="#fff" opacity=.35 transform="rotate(-30 68 52)" /></svg><span class=o1>🎁</span><span class=o2>⭐</span><span class=o3>🔔</span><span class=o4>🎄</span></div><h1>${[...'Тайный Санта'].map((c,i)=>`<span style="animation-delay:${i*70}ms">${c==' '?'&nbsp;':c}</span>`).join('')}</h1><p class=mut>Оформи карточку желаний, выбери своего Санту и жди жеребьёвки — кто-то уже придумывает тебе подарок.</p><button class=cta onclick="st=2;hap();view()">Начать</button></div>`;
 if(st==2)A.innerHTML=dots(2)+`<div class=glass><h2 class=gold>Кто ты?</h2><input id=n placeholder="Имя" value="${e(F.name)}"><input id=s placeholder="Фамилия" value="${e(F.surname)}"><input id=g placeholder="Группа" value="${e(F.group)}"><button onclick="if(!n.value.trim()||!s.value.trim()||!g.value.trim())return tg.showAlert('Заполни имя, фамилию и группу');F.name=n.value;F.surname=s.value;F.group=g.value;st=3;hap();view()">Дальше</button></div>`;
 if(st==3){const w=F.w;A.innerHTML=dots(3)+`<div id=pv>${card(F)}</div><div class=glass><h2 class=gold>Карточка желаний</h2><textarea id=d rows=3 placeholder="Что хочешь на Новый год?">${e(w.dream)}</textarea><textarea id=m rows=2 placeholder="Приятные мелочи (необязательно)">${e(w.small)}</textarea><textarea id=a rows=2 placeholder="Что точно не дарить (необязательно)">${e(w.avoid)}</textarea><p class=mut>Стиль карточки</p><div class=row>${TH.map(t=>`<div class="chip ${w.theme==t?'on':''}" onclick="F.w.theme='${t}';upd(1)">${{e:'🟢',r:'🔴',s:'🔵',g:'🟡'}[t]}</div>`).join('')}</div><div class=row style="margin-top:8px">${EM.map(x=>`<div class="chip ${w.emoji==x?'on':''}" onclick="F.w.emoji='${x}';upd(1)">${x}</div>`).join('')}</div><button onclick="if(!F.w.dream?.trim())return tg.showAlert('Напиши главное желание');st=4;hap();view()">Дальше</button></div>`;
  ['d','m','a'].forEach(i=>$('#'+i).oninput=()=>upd())}
 if(st==4)A.innerHTML=dots(4)+`<div class=glass><h2 class=gold>Выбери своего Санту</h2><p class=mut>Уровень определяет круг, в котором ты даришь и получаешь подарки.</p></div>`+[1,2,3].map(t=>{const T=S.tiers[t],own=t==1||S.u.paid?.[t],on=S.u.tier==t&&own;return `<div class="glass tier t${t} ${on?'on':''}" onclick="pick(${t})"><h2>${ICO[t]} ${T.n}</h2><p class=mut>${DESC[t]}</p><button class="${on?'ghost':''}">${on?'✓ Выбран':own?'Выбрать':'Вступить за '+T.p+' ⭐'}</button></div>`}).join('');
 if(st==10)home()}
function upd(full){const w=F.w;if($('#d')){w.dream=$('#d').value;w.small=$('#m').value;w.avoid=$('#a').value}if(full)return view();$('#pv').innerHTML=card(F);const c=$('#pv .wc');if(c)c.style.animation=`fl 7s ${-(Date.now()/1000%7).toFixed(2)}s ease-in-out infinite`}
async function pick(t){hap();const T=S.tiers[t];if(t==1||S.u.paid?.[t]){S=await api('tier',{tier:t});return finish()}
 const r=await api('invoice',{tier:t});if(!r.link)return tg.showAlert('Не удалось создать счёт');
 tg.openInvoice(r.link,async s=>{if(s=='paid'){await new Promise(x=>setTimeout(x,1500));await api('tier',{tier:t});finish()}})}
async function finish(){S=await api('save',{name:F.name,surname:F.surname,group:F.group,w:F.w});st=10;view()}
async function gd(){S=await api('gifted');home()}
async function friends(){const r=await api('ref');$('#app').innerHTML=`<div class=glass><h2 class=gold>Приглашай друзей 👥</h2><p class=mut>Получай комиссию с каждой покупки VIP-уровня твоих друзей. Чем больше друзей, тем выше процент: от 5% до 15%.</p><div class=ref><b>${r.rate}%</b><span>твоя комиссия</span></div><div class=bar><i style="width:${Math.min(100,r.n/30*100)}%"></i></div><p class=mut>${r.next?`Ещё ${r.next} друзей до ${r.rate+1}%`:'Максимальный уровень 🔥'}</p><p style="margin-top:10px">Приглашено: <b>${r.n}</b> · К выплате: <b>${r.bal}⭐</b></p><input readonly value="${e(r.link)}"><button onclick="navigator.clipboard?.writeText('${e(r.link)}');tg.showAlert('Ссылка скопирована')">Скопировать ссылку</button><button class=ghost onclick="tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent('${e(r.link)}')+'&text='+encodeURIComponent('Играем в Тайного Санту! 🎅'))">Отправить другу</button><button class=ghost onclick="home()">Назад</button></div>`}
function home(){const u=S.u;let h=card(u)+'<button class=ghost onclick="friends()">👥 Приглашай друзей играть вместе</button>';
 if(S.ward)h+=`<div class=glass><h2 class=gold>Ты даришь подарок 🎁</h2>${card(S.ward)}<button onclick="chat('santa')">Написать подопечному</button><button class="${S.gifted?'ghost':''}" onclick="gd()">${S.gifted?'✓ Подарок вручён':'🎁 Вручил(а) подарок'}</button></div>`;
 if(S.hasSanta)h+=`<button class=ghost onclick="chat('ward')">💬 Чат с Тайным Сантой</button>`;
 if(!S.drawn)h+=`<div class=glass><h2 class=gold>Ты в игре</h2><p class=mut>${ICO[u.tier]} ${S.tiers[u.tier].n}. Жеребьёвка скоро — мы пришлём уведомление.</p><button class=ghost onclick="st=2;view()">Изменить карточку</button><button class=ghost onclick="st=4;view()">Сменить Санту</button></div>`;
 $('#app').innerHTML=h}
async function chat(r){role=r;$('#app').innerHTML=`<div class=glass><h2 class=gold>${r=='santa'?'Твой подопечный':'Твой Тайный Санта'}</h2><div class=msgs id=ms></div><input id=t placeholder="Сообщение…"><button onclick="send()">Отправить</button><button class=ghost onclick="clearInterval(iv);load()">Назад</button></div>`;poll();clearInterval(iv);iv=setInterval(poll,5000)}
async function poll(){const r=await api('msgs',{role});const m=$('#ms');if(!m)return;const k=JSON.stringify(r.m);if(m.dataset.k==k)return;m.dataset.k=k;m.innerHTML=r.m.map(x=>`<div class="b ${x.me?'me':''}">${e(x.t)}</div>`).join('')||'<p class=mut>Напиши первое сообщение ✨</p>';m.scrollTop=1e9}
async function send(){const t=$('#t').value;if(!t.trim())return;$('#t').value='';hap();await api('send',{role,text:t});poll()}
const _fin=finish;finish=async()=>{await _fin();burst()};
// snow
const cv=$('#c'),x=cv.getContext('2d');let W,H,tm=0,cf=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();onresize=rs;
const fl=[...Array(70)].map(()=>{const z=Math.random();return{x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:.8+z*2.8,v:.12+z*.3,ph:Math.random()*6.28}}),sr=[...Array(70)].map(()=>({x:Math.random(),y:Math.random()*.6,r:Math.random()*1.4+.4,ph:Math.random()*6}));
const SP=document.createElement('canvas');SP.width=SP.height=32;{const g=SP.getContext('2d'),q=g.createRadialGradient(16,16,0,16,16,16);q.addColorStop(0,'rgba(255,255,255,1)');q.addColorStop(.3,'rgba(255,255,255,.9)');q.addColorStop(.55,'rgba(191,224,255,.22)');q.addColorStop(1,'rgba(191,224,255,0)');g.fillStyle=q;g.fillRect(0,0,32,32)}
function burst(){for(let i=0;i<90;i++){const a=Math.random()*6.28,s=3+Math.random()*7;cf.push({x:W/2,y:H*.45,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,c:['#ff7a90','#8fd0ff','#ffd36e','#b88cff','#4ce0d0'][i%5],l:1})}}
$('#scene').insertAdjacentHTML('beforeend',[26,92,312,372].map((v,i)=>`<g class=pn style="transform-origin:${v}px 165px;animation-delay:-${i}s"><polygon points="${v},100 ${v-15},138 ${v+15},138" fill="#164a45" /><polygon points="${v},120 ${v-20},162 ${v+20},162" fill="#103a3a" /></g>`).join(''));
(function f(){tm+=.008;x.clearRect(0,0,W,H);x.shadowBlur=0;x.fillStyle='#fff';sr.forEach(s=>{x.globalAlpha=.2+.6*Math.abs(Math.sin(tm*4+s.ph));x.fillRect(s.x*W,s.y*H,s.r,s.r)});x.globalAlpha=1;
 fl.forEach(p=>{p.y+=p.v;p.x+=Math.sin(tm+p.ph)*.2;if(p.y>H+6){p.y=-6;p.x=Math.random()*W}const d=p.r*6;x.drawImage(SP,p.x-d/2,p.y-d/2,d,d)});
 x.shadowBlur=0;cf=cf.filter(c=>c.l>0);cf.forEach(c=>{c.x+=c.vx;c.y+=c.vy;c.vy+=.25;c.vx*=.985;c.l-=.012;x.globalAlpha=Math.max(c.l,0);x.fillStyle=c.c;x.fillRect(c.x,c.y,6,9)});x.globalAlpha=1;requestAnimationFrame(f)})();

const fk=[...Array(14)].map((_,i)=>`<circle class=fk cx=${28+i*10+(i%3)*4} cy=14 r=${1+i%3*.7} style="animation-delay:-${(i*.7).toFixed(1)}s" />`).join('');
o.innerHTML=`<svg viewBox="0 0 200 220"><defs><radialGradient id=sgl cx=.35 cy=.3 r=.9><stop offset=0 stop-color="#fff" stop-opacity=.35 /><stop offset=1 stop-color="#8fd0ff" stop-opacity=.08 /></radialGradient><linearGradient id=ssk x1=0 y1=0 x2=0 y2=1><stop offset=0 stop-color="#1b1858" /><stop offset=1 stop-color="#8e3d8f" /></linearGradient><linearGradient id=sbs x1=0 y1=0 x2=0 y2=1><stop offset=0 stop-color="#e0305a" /><stop offset=1 stop-color="#7a1030" /></linearGradient><clipPath id=scp><circle cx=100 cy=96 r=80 /></clipPath></defs><rect x=40 y=160 width=120 height=46 rx=12 fill="url(#sbs)" /><rect x=48 y=164 width=104 height=4 rx=2 fill="#ffffff55" /><g clip-path="url(#scp)"><rect width=200 height=180 fill="url(#ssk)" /><circle cx=150 cy=40 r=9 fill="#fff7d6" /><ellipse cx=100 cy=170 rx=110 ry=44 fill="#f4f8ff" /><circle class=sb style="--d:.9s" cx=100 cy=132 r=26 fill="#fff" /><circle class=sb style="--d:1.4s" cx=100 cy=98 r=19 fill="#fff" /><circle class=sb style="--d:1.9s" cx=100 cy=72 r=14 fill="#fff" /><g class=sb style="--d:2.4s"><rect x=88 y=44 width=24 height=16 rx=2 fill="#1c1d58" /><rect x=82 y=58 width=36 height=4 rx=2 fill="#1c1d58" /><rect x=88 y=54 width=24 height=4 fill="#e0305a" /></g><g class=fd style="--d:2.9s" fill="#111"><circle cx=95 cy=70 r=1.8 /><circle cx=105 cy=70 r=1.8 /><circle cx=100 cy=96 r=1.8 /><circle cx=100 cy=104 r=1.8 /></g><polygon class=pp style="--d:3s" points="100,73 113,76 100,78" fill="#ff8a3d" /><path class=dw pathLength=1 style="--d:3.2s" d="M86 84 Q100 94 114 84 M108 88 L112 104" stroke="#e0305a" stroke-width=5 fill=none stroke-linecap=round /><path class=dw pathLength=1 style="--d:3.4s" d="M82 98 L60 86 M60 86 L55 78 M60 86 L54 91 M118 98 L140 86 M140 86 L145 78 M140 86 L146 91" stroke="#6b4423" stroke-width=2.5 fill=none stroke-linecap=round />${fk}</g><circle cx=100 cy=96 r=80 fill="url(#sgl)" stroke="#fff" stroke-opacity=.45 stroke-width=2 /><ellipse class=hl cx=68 cy=52 rx=18 ry=9 fill="#fff" opacity=.4 transform="rotate(-30 68 52)" /></svg><div class=sptx>${[...'Тайный Санта'].map((c,i)=>`<span style="animation-delay:${3.6+i*.06}s">${c==' '?'&nbsp;':c}</span>`).join('')}</div><small>нажми, чтобы пропустить</small>`;
document.body.appendChild(o);const end=()=>{o.classList.add('go');setTimeout(()=>o.remove(),700)};o.onclick=end;
setTimeout(()=>o.classList.add('sk'),3000);setTimeout(()=>{if(o.isConnected){end();burst()}},4700)}
let pq=0;['pointerdown','pointermove'].forEach(ev=>document.addEventListener(ev,e=>{if(pq)return;pq=1;const cx=e.clientX,cy=e.clientY,g=e.target.closest&&e.target.closest('.glass,button,.chip');requestAnimationFrame(()=>{pq=0;if(g){const r=g.getBoundingClientRect();g.style.setProperty('--mx',cx-r.left+'px');g.style.setProperty('--my',cy-r.top+'px')}})},{passive:true}));
load();splash();
</script></body></html>
